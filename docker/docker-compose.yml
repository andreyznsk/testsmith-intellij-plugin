version: "3.9"
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama:/root/.ollama
    environment:
      OLLAMA_NUM_GPU: "1"
    runtime: nvidia
    command: ["bash", "-lc", "ollama serve & sleep 2 && ollama pull qwen2.5-coder:7b && wait"]
    restart: unless-stopped
